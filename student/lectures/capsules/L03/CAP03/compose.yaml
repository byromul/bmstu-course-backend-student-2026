services:
  server:
    image: python:3.14.7-slim
    command: python -m server
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - server-data:/data
  client:
    image: python:3.14.7-slim
    command: python -m client
    environment:
      QUEST_API_URL: http://server:8000
volumes:
  server-data:
