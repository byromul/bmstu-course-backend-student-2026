<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Консольный квест: первый рабочий день</title>
<desc id="desc">Двенадцать кадров за 108 секунд. Программист проходит собеседование, получает работу, ошибочно передаёт агенту личные данные коллег, останавливает передачу и сообщает об инциденте. Затем он защищает сервер и фикус от инопланетянина, пишет тест, получает кубок героя. Проверка нарушения конфиденциальности продолжается.</desc>
<rect width="1600" height="900" fill="#e7edf4"/>
<rect x="78" y="68" width="1444" height="766" rx="24" fill="#0c1523" stroke="#31445d" stroke-width="3"/>
<path d="M78 92 Q78 68 102 68 H1498 Q1522 68 1522 92 V132 H78 Z" fill="#1d2a3a"/>
<circle cx="116" cy="101" r="9" fill="#ff6b6b"/><circle cx="148" cy="101" r="9" fill="#ffcf68"/><circle cx="180" cy="101" r="9" fill="#6bd19a"/>
<text x="800" y="110" text-anchor="middle" fill="#c4d0df" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="24">console_quest.py — демоверсия</text>
<rect x="118" y="744" width="1364" height="1" fill="#34445a"/>
<style>.frame{opacity:0} text{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<style>@keyframes f0{0%,8.3333%{opacity:1}8.3343%,100%{opacity:0}}.f0{animation:f0 108s linear 1 both}</style>
<g class="frame f0">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">КВЕСТ: ПЕРВЫЙ ДЕНЬ</text>
<text x="146" y="288" fill="#75b7ff" font-size="30" font-weight="400">$ python console_quest.py</text>
<text x="146" y="352" fill="#e9eef6" font-size="30" font-weight="400">Вы — программист Лёша. Цель: попасть в компанию «Галактика».</text>
<text x="146" y="416" fill="#e9eef6" font-size="30" font-weight="400">Бонусная цель: дожить до пятницы.</text>
<text x="146" y="480" fill="#9ba9bd" font-size="30" font-weight="400">Нажмите Enter, чтобы открыть дверь переговорной.</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">&gt; Enter</text>
<text x="146" y="608" fill="#6de0aa" font-size="30" font-weight="700">Дверь открыта. За ней три собеседующих и один фикус.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 01/12 · 00:00–00:09</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="22.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f1{0%,8.3323%{opacity:0}8.3333%,16.6667%{opacity:1}16.6677%,100%{opacity:0}}.f1{animation:f1 108s linear 1 both}</style>
<g class="frame f1">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">СОБЕСЕДОВАНИЕ · 1 ИЗ 2</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">HR: «Как вы реагируете, когда программа падает?»</text>
<text x="146" y="352" fill="#c8d2e1" font-size="30" font-weight="400">1) Читаю ошибку и пытаюсь повторить сбой.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">2) Говорю: «На моём компьютере работало».</text>
<text x="146" y="480" fill="#6de0aa" font-size="30" font-weight="700">&gt; 1</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">HR кивает. Фикус впервые проявляет уважение.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 02/12 · 00:09–00:18</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="44.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f2{0%,16.6657%{opacity:0}16.6667%,25.0000%{opacity:1}25.0010%,100%{opacity:0}}.f2{animation:f2 108s linear 1 both}</style>
<g class="frame f2">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">СОБЕСЕДОВАНИЕ · 2 ИЗ 2</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Техлид: «А если ошибка проявляется только по пятницам?»</text>
<text x="146" y="352" fill="#c8d2e1" font-size="30" font-weight="400">1) Запрещаю пятницы.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">2) Записываю условие в тест и ищу причину.</text>
<text x="146" y="480" fill="#6de0aa" font-size="30" font-weight="700">&gt; 2</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">ТЕСТ ПРОЙДЕН. Вам выдали пропуск и кружку без ручки.</text>
<text x="146" y="608" fill="#9ba9bd" font-size="30" font-weight="400">Подпись на кружке: «Сначала проверка».</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 03/12 · 00:18–00:27</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="66.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f3{0%,24.9990%{opacity:0}25.0000%,33.3333%{opacity:1}33.3343%,100%{opacity:0}}.f3{animation:f3 108s linear 1 both}</style>
<g class="frame f3">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">ПЕРВЫЙ РАБОЧИЙ ДЕНЬ</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Входящие: 47 задач. Кофе: 0. Коллеги ждут сводку.</text>
<text x="146" y="352" fill="#c8d2e1" font-size="30" font-weight="400">1) Запустить агента и скормить ему таблицу коллег.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">2) Уточнить границы доступа и собрать обезличенные данные.</text>
<text x="146" y="480" fill="#6de0aa" font-size="30" font-weight="700">&gt; 1</text>
<text x="146" y="544" fill="#ffc778" font-size="30" font-weight="700">Агент: «Спасибо! Тут имена, телефоны и адреса...»</text>
<text x="146" y="608" fill="#9ba9bd" font-size="30" font-weight="400">Лёша: «Ой».</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 04/12 · 00:27–00:36</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="88.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f4{0%,33.3323%{opacity:0}33.3333%,41.6667%{opacity:1}41.6677%,100%{opacity:0}}.f4{animation:f4 108s linear 1 both}</style>
<g class="frame f4">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">ТРЕВОГА БЕЗОПАСНОСТИ</text>
<text x="146" y="288" fill="#ffc778" font-size="30" font-weight="700">СЛУЖБА БЕЗОПАСНОСТИ: передача данных остановлена.</text>
<text x="146" y="352" fill="#e9eef6" font-size="30" font-weight="400">Руководитель: «Объясни, что произошло».</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">1) Спрятать журнал и обвинить фикус.</text>
<text x="146" y="480" fill="#c8d2e1" font-size="30" font-weight="400">2) Остановить агента и честно сообщить об ошибке.</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">&gt; 2</text>
<text x="146" y="608" fill="#6de0aa" font-size="30" font-weight="700">Доступ заблокирован. Начата проверка инцидента.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 05/12 · 00:36–00:45</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="110.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f5{0%,41.6657%{opacity:0}41.6667%,50.0000%{opacity:1}50.0010%,100%{opacity:0}}.f5{animation:f5 108s linear 1 both}</style>
<g class="frame f5">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">ПОЧТИ УВОЛЕН</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Руководитель: «Твой пропуск пока остаётся у меня».</text>
<text x="146" y="352" fill="#e9eef6" font-size="30" font-weight="400">Лёша: «Я не должен был передавать личные данные».</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">1) Помочь разобраться и исправить процесс.</text>
<text x="146" y="480" fill="#c8d2e1" font-size="30" font-weight="400">2) Продолжать спорить с журналом событий.</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">&gt; 1</text>
<text x="146" y="608" fill="#6de0aa" font-size="30" font-weight="700">Проверка продолжается. Работа тоже, пока что.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 06/12 · 00:45–00:54</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="132.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f6{0%,49.9990%{opacity:0}50.0000%,58.3333%{opacity:1}58.3343%,100%{opacity:0}}.f6{animation:f6 108s linear 1 both}</style>
<g class="frame f6">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">НЕОЖИДАННАЯ ВАКАНСИЯ</text>
<text x="146" y="288" fill="#ffc778" font-size="30" font-weight="700">ТРЕВОГА: в офис приземлился инопланетянин!</text>
<text x="146" y="352" fill="#e9eef6" font-size="30" font-weight="400">Он требует доступ к серверу и бесплатный чай.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">1) Выдать ему пароль от production.</text>
<text x="146" y="480" fill="#c8d2e1" font-size="30" font-weight="400">2) Закрыть доступ и выяснить, что он делает.</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">&gt; 2</text>
<text x="146" y="608" fill="#6de0aa" font-size="30" font-weight="700">Дверь серверной закрыта. Фикус служит баррикадой.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 07/12 · 00:54–01:03</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="154.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f7{0%,58.3323%{opacity:0}58.3333%,66.6667%{opacity:1}66.6677%,100%{opacity:0}}.f7{animation:f7 108s linear 1 both}</style>
<g class="frame f7">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">БОЙ · РАУНД 1</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Пришелец запустил 900 копий себя в тестовом контуре.</text>
<text x="146" y="352" fill="#c8d2e1" font-size="30" font-weight="400">1) Посмотреть журнал и повторить проблему.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">2) Нажать всё подряд на пульте.</text>
<text x="146" y="480" fill="#6de0aa" font-size="30" font-weight="700">&gt; 1</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">Журнал: клоны появляются после запроса /sync.</text>
<text x="146" y="608" fill="#9ba9bd" font-size="30" font-weight="400">Фикус одобрительно шелестит листьями.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 08/12 · 01:03–01:12</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="176.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f8{0%,66.6657%{opacity:0}66.6667%,75.0000%{opacity:1}75.0010%,100%{opacity:0}}.f8{animation:f8 108s linear 1 both}</style>
<g class="frame f8">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">БОЙ · РАУНД 2</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Нужно остановить /sync, не сломав остальные запросы.</text>
<text x="146" y="352" fill="#c8d2e1" font-size="30" font-weight="400">1) Выдернуть питание из всего офиса.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">2) Написать тест, закрыть маршрут, проверить снова.</text>
<text x="146" y="480" fill="#6de0aa" font-size="30" font-weight="700">&gt; 2</text>
<text x="146" y="544" fill="#ffc778" font-size="30" font-weight="700">Тест красный: клоны ещё появляются.</text>
<text x="146" y="608" fill="#6de0aa" font-size="30" font-weight="700">После правки тест зелёный. Новых клонов нет.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 09/12 · 01:12–01:21</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="198.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f9{0%,74.9990%{opacity:0}75.0000%,83.3333%{opacity:1}83.3343%,100%{opacity:0}}.f9{animation:f9 108s linear 1 both}</style>
<g class="frame f9">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">ПОСЛЕДНИЙ ХОД</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Пришелец один. Он держит фикус в заложниках.</text>
<text x="146" y="352" fill="#c8d2e1" font-size="30" font-weight="400">1) Предложить чай и билет домой.</text>
<text x="146" y="416" fill="#c8d2e1" font-size="30" font-weight="400">2) Предложить ему пароль и печенье.</text>
<text x="146" y="480" fill="#6de0aa" font-size="30" font-weight="700">&gt; 1</text>
<text x="146" y="544" fill="#6de0aa" font-size="30" font-weight="700">Пришелец выбирает чай. Фикус спасён.</text>
<text x="146" y="608" fill="#9ba9bd" font-size="30" font-weight="400">Печенье тоже спасено, но ненадолго.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 10/12 · 01:21–01:30</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="220.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f10{0%,83.3323%{opacity:0}83.3333%,91.6667%{opacity:1}91.6677%,100%{opacity:0}}.f10{animation:f10 108s linear 1 both}</style>
<g class="frame f10">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">НАГРАДА</text>
<text x="146" y="288" fill="#6de0aa" font-size="30" font-weight="700">КВЕСТ ПРОЙДЕН! Вам вручили кубок «Герой офиса».</text>
<text x="146" y="352" fill="#e9eef6" font-size="30" font-weight="400">На кубке гравировка: «За спасение фикуса и сервера».</text>
<text x="146" y="416" fill="#ffc778" font-size="30" font-weight="700">Проверка передачи данных коллег всё ещё идёт.</text>
<text x="146" y="480" fill="#e9eef6" font-size="30" font-weight="400">Руководитель: «Кубок оставь. Правила доступа изучи».</text>
<text x="146" y="544" fill="#9ba9bd" font-size="30" font-weight="400">Лёша кивает. На этот раз без помощи агента.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 11/12 · 01:30–01:39</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="242.0" height="13" rx="6" fill="#6de0aa"/>
</g>
<style>@keyframes f11{0%,91.6657%{opacity:0}91.6667%,100%{opacity:1}}.f11{animation:f11 108s linear 1 both}</style>
<g class="frame f11">
<text x="146" y="203" fill="#77c7ff" font-size="42" font-weight="700">ЧТО БЫЛО В ЭТОМ КВЕСТЕ</text>
<text x="146" y="288" fill="#e9eef6" font-size="30" font-weight="400">Сцена → варианты → ввод → новое состояние.</text>
<text x="146" y="352" fill="#e9eef6" font-size="30" font-weight="400">Одно решение меняло ход истории; ошибка имела последствия.</text>
<text x="146" y="416" fill="#6de0aa" font-size="30" font-weight="700">Финал: герой с кубком, фикус жив, тесты зелёные.</text>
<text x="146" y="480" fill="#ffc778" font-size="30" font-weight="700">Личные данные нельзя передавать агенту без разрешения.</text>
<text x="146" y="544" fill="#9ba9bd" font-size="30" font-weight="400">Нажмите →, чтобы перейти к маршруту курса.</text>
<text x="146" y="791" fill="#9ba9bd" font-size="22">КАДР 12/12 · 01:39–01:48</text>
<rect x="1218" y="774" width="264" height="13" rx="6" fill="#34445a"/><rect x="1218" y="774" width="264.0" height="13" rx="6" fill="#6de0aa"/>
</g>
</svg>
